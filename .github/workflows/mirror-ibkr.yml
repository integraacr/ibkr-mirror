# GitHub Actions workflow that mirrors IBKR's public shortstock FTP feed to
# this repo as `usa.txt`. Runs every 4 hours during market hours plus a few
# off-hours times for redundancy. Manual trigger available via "workflow_dispatch".
#
# After the first successful run, your file will be available at:
#   https://raw.githubusercontent.com/<YOUR_USERNAME>/<REPO_NAME>/main/usa.txt
#
# Save this file at the path:  .github/workflows/mirror-ibkr.yml
#
# CHANGE LOG
# ----------
# v1: ftp3.interactivebrokers.com only, 60s timeout, ubuntu-latest.
# v2: Multi-host fallback (ftp3 → ftp2). Some IBKR FTP servers reject specific
#     IP ranges or are intermittently overloaded; trying both improves the odds
#     of at least one connection succeeding. Timeout raised to 90s.

name: Mirror IBKR shortstock

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours UTC
  workflow_dispatch:         # allow manual trigger

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch usa.txt from IBKR FTP (tries ftp3 then ftp2)
        run: |
          python3 <<'EOF'
          import ftplib, os, sys, socket
          # Both hosts publish the same usa.txt. ftp3 is the canonical one
          # cited in IBKR's docs; ftp2 is documented for prime-trade uploads
          # but historically also serves shortstock data.
          hosts = [
              'ftp3.interactivebrokers.com',
              'ftp2.interactivebrokers.com',
          ]
          last_err = None
          for host in hosts:
              try:
                  print(f'Trying {host} ...', flush=True)
                  # 90s is generous - IBKR's FTP can be slow even when reachable
                  ftp = ftplib.FTP(host, timeout=90)
                  ftp.login('shortstock')  # blank password
                  with open('usa.txt', 'wb') as f:
                      ftp.retrbinary('RETR usa.txt', f.write)
                  ftp.quit()
                  size = os.path.getsize('usa.txt')
                  if size < 100000:
                      print(f'  WARN: {host} returned only {size} bytes - trying next host', flush=True)
                      last_err = Exception(f'{host} returned tiny file ({size}b)')
                      continue
                  print(f'  OK from {host}: {size} bytes')
                  sys.exit(0)
              except Exception as e:
                  err_type = type(e).__name__
                  print(f'  {host} failed: {err_type}: {e}', flush=True)
                  last_err = e
          # All hosts failed
          print(f'\nAll IBKR FTP hosts unreachable from this runner.', file=sys.stderr)
          print(f'Last error: {type(last_err).__name__}: {last_err}', file=sys.stderr)
          sys.exit(1)
          EOF

      - name: Commit updated usa.txt (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usa.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update usa.txt $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes - skipping commit"
          fi
